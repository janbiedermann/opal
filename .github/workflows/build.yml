name: build

on:
  push:
    branches:
      - master
      - '*-stable'
      - '*/ci-check'
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.combo.name }}
    env:
      DEFAULT_NODE: '22'
    strategy:
      fail-fast: false
      matrix:
        combo:
          - name: nodejs
            command: node tasks/test.mjs
          - name: nodejs-24
            node: '24'
            command: node tasks/test.mjs
          - name: mspec-chrome
            command: node tasks/test.mjs -R chrome mspec
          - name: mspec-firefox
            # the Firefox runner uses WebDriver BiDi (Firefox >= 112)
            firefox: 'latest'
            command: xvfb-run node tasks/test.mjs -R firefox mspec
          - name: mspec-bun
            bun: true
            command: node tasks/test.mjs -R bun mspec
          - name: mspec-deno
            deno: true
            command: node tasks/test.mjs -R deno mspec
          - name: minitest-chrome
            command: node tasks/test.mjs -R chrome minitest_cruby
          - name: minitest-strict-mode
            command: node tasks/test.mjs minitest
            strict: 'true'
          - name: windows
            command: node tasks/test.mjs
            os: windows-latest
          - name: windows-mspec-chrome
            command: node tasks/test.mjs -R chrome mspec
            os: windows-latest
          - name: macos
            command: node tasks/test.mjs
            os: 'macos-latest'
          - name: macos-mspec-safari
            command: node tasks/test.mjs -R safari mspec
            os: 'macos-latest'
          - name: lint
            command: node tasks/lint.mjs
          - name: timezone
            command: node tasks/test.mjs mspec
            tz: 'Pacific/Fiji'
          - name: performance
            permissive: true
            fetchdepth: '0'
            base_ref: ${{ github.base_ref }}
            command: node tasks/performance.mjs
          - name: codesize
            permissive: true
            fetchdepth: '0'
            base_ref: ${{ github.base_ref }}
            command: node tasks/codesize.mjs

    runs-on: ${{ matrix.combo.os || 'ubuntu-latest' }}
    continue-on-error: ${{ matrix.combo.permissive || false }}
    steps:
      - if: ${{ matrix.combo.bun }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.30
      - if: ${{ matrix.combo.deno }}
        uses: denoland/setup-deno@v2
      - if: ${{ matrix.combo.firefox }}
        id: setup-firefox
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: ${{ matrix.combo.firefox }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ fromJSON(matrix.combo.fetchdepth || '1') }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.combo.node || env.DEFAULT_NODE }}
      - run: node bin/git-submodule-fast-install
      - uses: actions/cache@v4
        with:
          path: ./node_modules
          key: ${{ runner.os }}-npm-${{ github.ref }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ github.ref }}
            ${{ runner.os }}-npm-master
            ${{ runner.os }}-npm-
      - run: yarn install
      - name: set environment variables USE_STRICT
        if: ${{ matrix.combo.strict == 'true' }}
        run: |
          echo "USE_STRICT=true" >> $GITHUB_ENV
      - name: set environment variables TZ
        if: ${{ matrix.combo.tz }}
        run: |
          echo "TZ=${{ matrix.combo.tz }}" >> $GITHUB_ENV
      - name: set environment variables MOZILLA_FIREFOX_BINARY
        if: ${{ matrix.combo.firefox }}
        run: |
          echo "MOZILLA_FIREFOX_BINARY=${{ steps.setup-firefox.outputs.firefox-path }}" >> $GITHUB_ENV
      - name: set environment variables GIT_BASE_REF
        if: ${{ matrix.combo.base_ref }}
        run: |
          echo "GIT_BASE_REF=${{ matrix.combo.base_ref }}" >> $GITHUB_ENV
      - run: ${{ matrix.combo.command }}
